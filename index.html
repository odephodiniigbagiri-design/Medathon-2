function gFail(j,why){const q=GQ;MQ=null;MB=1;$('#tray').innerHTML='';const h=$('#hint');h.style.color='var(--bad)';h.textContent='Gate jammed! The answer was '+q.c+'. '+why+' Back to the last checkpoint.';const ci=j?GI[j-1]:0;setTimeout(()=>{if(!MZ||!PM)return;MP=PTH[ci].slice();TR=PTH.slice(0,ci+1);TRYS[j]=2;mDraw();MB=0},2200)}
function gOpen(j){const e=PW.E[j],N=PW.N;ATP+=e[1];NAD+=e[2];sfx('coin');sc+=10;fly('🪙',2,$('#sc'),()=>{SS+=5;hud()});$('#tray').innerHTML='';const g=$('#gt'+j);g.classList.add('open');g.querySelector('text').textContent='🔓';$('#chain').textContent=N.slice(0,j+2).map(n=>n[0]).join(' → ');const h=$('#hint');h.style.color='';h.textContent='Gate open! '+N[j+1][0]+' reached ('+e[0]+'). Pick your direction.';MB=0}

function sfx(k){if(!SND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const z=AC.currentTime,n=(f,d,s=0,ty='sine',v=.15)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,z+s);g.gain.exponentialRampToValueAtTime(.001,z+s+d);o.connect(g);g.connect(AC.destination);o.start(z+s);o.stop(z+s+d)};if(k=='snap')n(520,.08,0,'triangle');else if(k=='coin'){n(988,.08,0,'square',.07);n(1319,.15,.07,'square',.07)}else if(k=='bad'){n(160,.25,0,'sawtooth',.1);navigator.vibrate&&navigator.vibrate(120)}else if(k=='win')[523,659,784,1047].forEach((f,x)=>n(f,.2,x*.09));else if(k=='up')[392,523,659,784,1047].forEach((f,x)=>n(f,.22,x*.1,'triangle'));else if(k=='hint')n(700,.12)}catch(e){}}

function fly(e,n,tg,cb,dl=0){const a=$('#stage').getBoundingClientRect(),b=tg.getBoundingClientRect(),sx=a.left+a.width/2,sy=a.top+a.height/2,ex=b.left+b.width/2,ey=b.top+b.height/2;for(let k=0;k<n;k++){const c=document.createElement('span');c.className='coin';c.textContent=e;$('#fx').appendChild(c);const ox=(Math.random()-.5)*140,oy=(Math.random()-.5)*60;c.animate([{transform:`translate(${sx}px,${sy}px) scale(.3)`,opacity:0},{transform:`translate(${sx+ox}px,${sy+oy-40}px) scale(1.2)`,opacity:1,offset:.3},{transform:`translate(${ex-17}px,${ey-17}px) scale(.6)`,opacity:1}],{duration:1100,delay:dl+k*110,easing:'ease-in',fill:'both'}).onfinish=()=>{c.remove();tg.classList.remove('bump');void tg.offsetWidth;tg.classList.add('bump');sfx('coin');cb(k)}}}

function celeb2(msg,pts,d,up){const stg=$('#stage'),n=Math.min(10,Math.max(3,Math.ceil(pts/25))),stp=Math.round(pts/n);let given=0;stg.classList.add('glow');sync(msg,()=>{$('#hint').textContent=msg;pop(msg);sfx('win')});fly('🪙',n,$('#sc'),k=>{const v=k==n-1?pts-given:stp;given+=v;SS+=v;hud()});fly('💎',d,$('#dm'),()=>{SD++;hud()},400);if(up)setTimeout(()=>{sync('Level up!',()=>{pop('LEVEL UP! Lv'+(lvl()+1)+' 🚀','54%');sfx('up')});const m=$('#mt');m.classList.remove('bump');void m.offsetWidth;m.classList.add('bump')},1300);}

 T=t=12+sl.length*4;$('#ti').textContent=cur.n;$('#hint').textContent='Drag each group onto the skeleton, then tap Check answer';

 const dec=cur.k=='p'?PD(cur):cur.k=='d'?shuf(['Glucose','Galactose','Fructose']).slice(0,2).concat(shuf(LK.filter(q=>q!=cur.u[1])).slice(0,2)):cur.k=='f'?shuf(['NH2','CH3','COOH']).slice(0,2):shuf(D.filter(m=>m.k=='a'&&m.R!=cur.R&&m.R!='H').map(m=>m.R)).slice(0,3).concat(cur.N?['H₂N']:[]);
