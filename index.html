$('#stage').onclick=e=>{const s=e.target.closest('[data-s]');if(!s)return;const j=+s.dataset.s;if(SEL&&SEL.isConnected&&PL[j]==null){const c=SEL;SEL=null;drop(c,s);return}if(PL[j]==null)return;const l=PL[j];delete PL[j];delete s.dataset.g;s.classList.remove('fl','ok','bad');if(ph==1)$('#t'+j).textContent='';else s.textContent='?';addChip(l)};
function check(){const ks=ph==1?sl.map((_,j)=>j):[0];if(ks.some(j=>PL[j]==null)){$('#hint').textContent=ph==1?'Place every group first, then check.':'Place the molecule first, then check.';return}let bad=0;ks.forEach(j=>{const ok=ph==1?PL[j]==sl[j][2]:PL[j]==cur.pn,el=document.querySelector('[data-s="'+j+'"]');el.classList.remove('ok','bad','fl');el.classList.add(ok?'ok':'bad');if(!ok)bad++});if(bad){miss();$('#hint').textContent=(ks.length-bad)+' of '+ks.length+' correct. Tap a red one to take it back, then try again.';return}ph==1?done1():win()}
function hint(){sfx('hint');if(ph==1){const j=sl.findIndex((s,k)=>PL[k]!==s[2]);if(j<0){$('#hint').textContent='Everything looks right. Tap Check answer.';return}H++;const el=document.querySelector('[data-s="'+j+'"]');el.classList.remove('pulse');void el.getBoundingClientRect();el.classList.add('pulse');$('#hint').textContent='Hint: the pulsing slot takes '+sl[j][2]}else{if(PL[0]===cur.pn){$('#hint').textContent='Looks right. Tap Check answer.';return}H++;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('pulse',c.dataset.l==cur.pn));$('#hint').textContent='Hint: it is the molecule that is converted into '+cur.p.c[0]}}
let SS=0,SD=0,SND=true,AC,SEL=null,VOX=true,BZ=0;
const CP=[['Nice work! 👍','Good job! 💪','You got there! 🙌','Well done! 🌟','Keep going, you are improving! 🚀','Solid effort! 👏','Getting stronger! 💡','Learning in action! 📚'],['Sweet! 🍬','Great job! 🎉','Brilliant! ✨','Smart move! 🧠','Very nice! 😎','Sharp thinking! 🔍','You are on a roll! 🎯','Excellent! 🌈'],['FLAWLESS! ⚡','Perfect! 💯','Genius! 🧠','Unstoppable! 🔥','Absolute legend! 👑','Biochem boss! 🏆','Outstanding! 🌟','Spotless! 💎']],USED=[[],[],[]],EN=['Almost there!','Not quite. Check the red ones.','Close! Have another go.','You can do it, try again!'];
function pick(q){const a=CP[q],u=USED[q];if(u.length>=a.length)u.length=0;let k;do{k=Math.floor(Math.random()*a.length)}while(u.includes(k));u.push(k);return TM&&q==2&&Math.random()<.4?'LIGHTNING FAST! ⚡':a[k]}
function say(t,cb){if(!VOX||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t.replace(/[^A-Za-z0-9\s!?.,']/g,'').trim());u.rate=1.05;u.pitch=1.15;u.lang='en-US';if(cb&&speechSynthesis.speaking){speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(u),80)}else speechSynthesis.speak(u);return true}catch(e){}}
function sync(text,show){try{show()}catch(e){console.error(e)}say(text,1)}
function sub(){ov('<h2>Carbohydrates</h2><button onclick="go(C)">Monosaccharides</button><button onclick="go(DS)">Disaccharides</button><button onclick="go(PS)">Polysaccharides</button><button class="g" onclick="menu()">‹ Back</button>')}
function vox(){VOX=!VOX;menu();if(VOX)say('Voice is on')}
function near(x,y){let b=null,bd=1e9;document.querySelectorAll('#stage [data-s]').forEach(s=>{if(PL[s.dataset.s]!=null)return;const r=s.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2));if(d<bd){bd=d;b=s}});return bd<70?b:null}
function selectChip(c){document.querySelectorAll('.chip.sel').forEach(x=>x.classList.remove('sel'));if(SEL===c){SEL=null;return}SEL=c;c.classList.add('sel');$('#hint').textContent='Now tap the slot where it goes'}
function burst(el){const r=el.getBoundingClientRect(),f=$('#fx');for(let k=0;k<9;k++){const p=document.createElement('i'),a=k*.7+Math.random()*.4,d=34+Math.random()*26;p.className='sp';p.style.cssText='left:'+(r.left+r.width/2)+'px;top:'+(r.top+r.height/2)+'px;--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px;background:hsl('+Math.random()*360+',85%,65%)';f.appendChild(p);setTimeout(()=>p.remove(),1000)}}function lvl(){const mp=mast();return mp<.3?0:mp<.5?1:mp<.7?2:mp<.9?3:4}
function sfx(k){if(!SND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const z=AC.currentTime,n=(f,d,s=0,ty='sine',v=.15)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,z+s);g.gain.exponentialRampToValueAtTime(.001,z+s+d);o.connect(g);g.connect(AC.destination);o.start(z+s);o.stop(z+s+d)};if(k=='snap')n(520,.08,0,'triangle');else if(k=='coin'){n(988,.08,0,'square',.07);n(1319,.15,.07,'square',.07)}else if(k=='bad'){n(160,.25,0,'sawtooth',.1);navigator.vibrate&&navigator.vibrate(120)}else if(k=='win')[523,659,784,1047].forEach((f,x)=>n(f,.2,x*.09));else if(k=='up')[392,523,659,784,1047].forEach((f,x)=>n(f,.22,x*.1,'triangle'));else if(k=='hint')n(700,.12)}catch(e){}}
function snapIt(s){sfx('snap');burst(s);navigator.vibrate&&navigator.vibrate(15);s.classList.remove('snap');void s.getBoundingClientRect();s.classList.add('snap')}
function pop(msg,tp='32%'){const f=$('#fx'),d=document.createElement('div');d.className='pop';d.style.top=tp;d.textContent=msg;f.appendChild(d);setTimeout(()=>d.remove(),2400);for(let k=0;k<22;k++){const p=document.createElement('i'),a=Math.random()*6.283,r=90+Math.random()*130;p.className='sp';p.style.cssText='--dx:'+Math.cos(a)*r+'px;--dy:'+Math.sin(a)*r+'px;background:hsl('+Math.random()*360+',90%,60%)';f.appendChild(p);setTimeout(()=>p.remove(),1100)}}
function fly(e,n,tg,cb,dl=0){const a=$('#stage').getBoundingClientRect(),b=tg.getBoundingClientRect(),sx=a.left+a.width/2,sy=a.top+a.height/2,ex=b.left+b.width/2,ey=b.top+b.height/2;for(let k=0;k<n;k++){const c=document.createElement('span');c.className='coin';c.textContent=e;$('#fx').appendChild(c);const ox=(Math.random()-.5)*140,oy=(Math.random()-.5)*60;c.animate([{transform:`translate(${sx}px,${sy}px) scale(.3)`,opacity:0},{transform:`translate(${sx+ox}px,${sy+oy-40}px) scale(1.2)`,opacity:1,offset:.3},{transform:`translate(${ex-17}px,${ey-17}px) scale(.6)`,opacity:1}],{duration:1100,delay:dl+k*110,easing:'ease-in',fill:'both'}).onfinish=()=>{c.remove();tg.classList.remove('bump');void tg.offsetWidth;tg.classList.add('bump');sfx('coin');cb(k)}}}
function celebrate(msg,pts,d,up){$('#ft').style.display='none';setTimeout(()=>{SS=sc;SD=dm;hud()},up?3500:2500);setTimeout(()=>{$('#stage').classList.remove('glow');nxt()},up?3800:2700);try{celeb2(msg,pts,d,up)}catch(e){console.error(e)}}
function celeb2(msg,pts,d,up){const stg=$('#stage'),n=Math.min(10,Math.max(3,Math.ceil(pts/25))),stp=Math.round(pts/n);let given=0;stg.classList.add('glow');sync(msg,()=>{$('#hint').textContent=msg;pop(msg);sfx('win')});fly('🪙',n,$('#sc'),k=>{const v=k==n-1?pts-given:stp;given+=v;SS+=v;hud()});fly('💎',d,$('#dm'),()=>{SD++;hud()},400);if(up)setTimeout(()=>{sync('Level up!',()=>{pop('LEVEL UP! Lv'+(lvl()+1)+' 🚀','54%');sfx('up')});const m=$('#mt');m.classList.remove('bump');void m.offsetWidth;m.classList.add('bump')},1300);}
const P={},BK={l:.15,s:.1,g:.2};
function obs(ok){const p=P[cur.n]??.2,q=ok?p*(1-BK.s)/(p*(1-BK.s)+(1-p)*BK.g):p*BK.s/(p*BK.s+(1-p)*(1-BK.g));P[cur.n]=q+(1-q)*BK.l}
function mast(){const a=M.filter(m=>P[m.n]!=null).map(m=>P[m.n]);return a.length?a.reduce((x,y)=>x+y,0)/a.length:.2}
function hud(){const mp=mast(),k=mp<.3?0:mp<.5?1:mp<.7?2:mp<.9?3:4,f=t/T;$('#sc').textContent='🪙 '+SS;$('#dm').textContent='💎 '+SD;$('#mt').textContent='Lv'+(k+1)+' · '+Math.round(mp*100)+'%';$('#tm').textContent=TM?Math.ceil(t)+'s':'📖 Learn';$('.clk svg').style.display=TM?'':'none';const r=$('#ring');r.style.strokeDashoffset=100*(1-f);r.style.stroke=f<.25?'var(--bad)':'var(--ac)';$('#hand').setAttribute('transform','rotate('+360*(1-f)+' 22 22)');const sk=$('#stk');sk.textContent=st>=2?'🔥'.repeat(Math.min(st-1,5))+' Streak ×'+st:'';sk.style.fontSize=(14+Math.min(st,8)*2)+'px'}
function load(){BZ=0;$('#ov').style.display='none';cur=M[i];const L=lay(cur);sl=L.s;filled={};PL={};A=0;H=0;ph=1;$('#ft').style.display='flex';
 T=t=12+sl.length*4;$('#ti').textContent=cur.n;$('#hint').textContent='Drag each group onto the skeleton, then tap Check answer';
 $('#stage').innerHTML='<svg viewBox="0 0 300 '+L.h+'">'+(L.key!=null?keyBand(L.key):'')+(L.x||'')+L.l.map(a=>`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}"/>`).join('')+L.c.map(y=>`<g class="cb"><circle cx="150" cy="${y}" r="10"/><text x="150" y="${y+4}">C</text></g>`).join('')+sl.map((s,j)=>`<g class="sl" data-s="${j}"><circle cx="${s[0]}" cy="${s[1]}" r="22"${s[3]?' style="transform-box:fill-box;transform-origin:center;transform:scaleX(3.3)"':''}/><text x="${s[0]}" y="${s[1]+5}" id="t${j}"${s[3]?' style="font-size:12.5px"':''}></text></g>`).join('')+'</svg>'+(cur.kn?'<p class="m" style="font-size:13px"><b style="background:var(--g-key);color:#9a4b36;padding:3px 10px;border-radius:8px">'+cur.kn+'</b></p>':'');
 const dec=cur.k=='p'?PD(cur):cur.k=='d'?shuf(['Glucose','Galactose','Fructose']).slice(0,2).concat(shuf(LK.filter(q=>q!=cur.u[1])).slice(0,2)):cur.k=='f'?shuf(['NH2','CH3','COOH']).slice(0,2):shuf(D.filter(m=>m.k=='a'&&m.R!=cur.R&&m.R!='H').map(m=>m.R)).slice(0,3).concat(cur.N?['H₂N']:[]);
 tray(shuf(sl.map(s=>s[2]).concat(dec)));clearInterval(iv);if(TM)iv=setInterval(()=>{t-=.1;if(t<=0){t=0;hud();lose()}else hud()},100);hud()}
function tray(a){$('#tray').innerHTML=a.map(x=>`<div class="chip" data-l="${x}" data-g="${gc(x)}">${x}</div>`).join('');
 document.querySelectorAll('.chip').forEach(c=>c.onpointerdown=e=>drag(e,c))}
function drag(e,c){e.preventDefault();const g=c.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);c.style.opacity=.3;
 let mx=0,x0=e.clientX,y0=e.clientY;const mv=v=>{g.style.left=v.clientX+'px';g.style.top=v.clientY+'px';mx=Math.max(mx,Math.abs(v.clientX-x0)+Math.abs(v.clientY-y0));const r=g.getBoundingClientRect(),s=near(r.left+r.width/2,r.top+r.height/2);document.querySelectorAll('.hov').forEach(h=>h!=s&&h.classList.remove('hov'));if(s)s.classList.add('hov')};mv(e);mx=0;
 const up=v=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);const gr=g.getBoundingClientRect();g.remove();c.style.opacity=1;document.querySelectorAll('.hov').forEach(h=>h.classList.remove('hov'));
  if(mx<8){selectChip(c);return}const s=near(gr.left+gr.width/2,gr.top+gr.height/2);if(s)drop(c,s)};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
function miss(){sfx('bad');say(EN[Math.floor(Math.random()*EN.length)]);obs(false);A++;if(TM)t=Math.max(0,t-3);const s=$('#stage');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');hud()}
function drop(c,s){const j=+s.dataset.s;
 if(ph==1){if(PL[j]!=null)return;PL[j]=c.dataset.l;$('#t'+j).textContent=PL[j];s.classList.add('fl');s.dataset.g=gc(PL[j]);snapIt(s);c.remove()}
 else{if(PL[0]!=null)return;PL[0]=c.dataset.l;s.textContent=PL[0];s.classList.add('fl');snapIt(s);c.remove()}}
function done1(){if(!cur.p)return win();ph=2;PL={};$('#hint').textContent='Now drag the molecule into its place in the pathway';
 $('#stage').innerHTML='<div class="path"><div class="nd bl" data-s="0">?</div>'+cur.p.c.map(x=>`<span>→</span><div class="nd">${x}</div>`).join('')+'</div>';tray(shuf([cur.pn].concat(cur.p.d)))}
function win(){if(BZ)return;BZ=1;clearInterval(iv);let q=A+H==0?2:A+H<=1?1:0;if(TM&&t/T<.35)q=Math.max(0,q-1);const msg=pick(q),pts=Math.max(20,100-A*20-H*25)+(TM?Math.round(t*10):0)+st*20;
 sc+=pts;st=q>0?st+1:0;wins++;dm+=q+1;const lv0=lvl();obs(H==0);const up=lvl()>lv0;hud();celebrate(msg,pts,q+1,up)}
function nxt(){i++;if(i>=M.length)ov(`<h2>World cleared! 🎉</h2><p class="m">Final: 🪙 ${sc} · 💎 ${dm}</p><button onclick="go(M[0].w)">Play again</button><button class="g" onclick="menu()">Menu</button>`);else load()}
function lose(){clearInterval(iv);st=0;obs(false);hud();ov('<h2>Time’s up ⏰</h2><p class="m">Streak reset. You’ve got this.</p><button onclick="load()">Try again</button><button class="g" onclick="menu()">Quit</button>')}
menu();
</script></body></html>
